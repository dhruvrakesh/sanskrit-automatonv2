<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Images - Sanskrit Automaton</title>
<!-- IMAGES_UI_2026_10_03 - served by images_web.py at /images -->
<style>
:root{
  --bg:#0e0d0b; --bg2:#161411; --bg3:#1e1b16; --bg4:#28231b;
  --border:#35302680; --gold:#d4a017; --saffron:#f47c20; --cream:#f0e6cc;
  --muted:#8a7d67; --ink:#e8dcc8; --green:#4caf7d; --red:#e05f5f; --blue:#6b9bd2; --purple:#a07dd6;
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,'Segoe UI',sans-serif}
a{color:var(--gold)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.top h1{font-size:15px;margin:0;color:var(--cream)}
.top .sp{flex:1}
select,input,textarea,button{font:inherit;color:var(--ink);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm)}
select,input{padding:5px 8px}
textarea{width:100%;padding:6px 8px;min-height:3.2em;resize:vertical}
button{padding:5px 11px;cursor:pointer}
button:hover{border-color:var(--gold)}
button.primary{background:#3a2d10;border-color:var(--gold);color:var(--cream)}
button.danger{border-color:#e05f5f80;color:#f0a0a0}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:3px 9px;border-radius:99px;border:1px solid var(--border);cursor:pointer;font-size:12.5px;color:var(--muted)}
.chip.on{color:var(--cream);border-color:var(--gold)}
.note{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:16px;align-items:start}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.thumb{aspect-ratio:4/3;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12.5px;text-align:center;padding:8px}
.thumb img{width:100%;height:100%;object-fit:contain;cursor:zoom-in}
.thumb:has(img){padding:0}
.body{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.ttl{font-weight:600;color:var(--cream)}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.badge{padding:1px 8px;border-radius:99px;font-size:11.5px;border:1px solid}
.b-brief{color:var(--blue);border-color:var(--blue)}
.b-brief-approved{color:var(--purple);border-color:var(--purple)}
.b-draft{color:var(--saffron);border-color:var(--saffron)}
.b-approved{color:var(--green);border-color:var(--green)}
.b-retired{color:var(--muted);border-color:var(--muted)}
.cap{font-size:13px}
.cap.hi{font-family:'Nirmala UI','Noto Sans Devanagari',sans-serif}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
details{border-top:1px solid var(--border);padding:8px 12px}
details summary{cursor:pointer;color:var(--muted);font-size:12.5px}
.ed label{display:block;font-size:11.5px;color:var(--muted);margin-top:6px}
.passage{background:var(--bg3);border-radius:var(--r-sm);padding:6px 8px;font-size:12.5px;margin-top:6px;white-space:pre-wrap}
.passage .sa{font-family:'Nirmala UI','Noto Serif Devanagari',serif}
#toast{position:fixed;right:16px;bottom:16px;max-width:460px;background:var(--bg4);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;display:none;white-space:pre-wrap;font-size:13px}
#zoom{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;cursor:zoom-out}
#zoom img{max-width:94vw;max-height:94vh}
.empty{padding:40px 16px;color:var(--muted);text-align:center}
@media (max-width:640px){.grid{padding:10px;gap:10px}.top,.bar{padding:8px 10px}}
</style>
</head>
<body>
<div class="top">
  <a href="/" style="text-decoration:none">&larr; Dashboard</a>
  <h1>Image library</h1>
  <select id="doc" title="Text"></select>
  <span class="sp"></span>
  <span class="note" id="summary"></span>
</div>
<div class="bar">
  <div class="chips" id="filters"></div>
  <span class="sp" style="flex:1"></span>
  <label class="note">ideas <input id="maxn" type="number" min="1" max="12" value="6" style="width:4em"></label>
  <button id="btnBrief" title="Ask the model for a few illustration ideas anchored to verses (one text call)">Propose ideas</button>
  <button id="btnGen" class="primary" title="Draw every approved idea once (one image call each)">Generate approved ideas</button>
  <button id="btnDedupe" title="Retire later ideas at the same verse">Remove duplicates</button>
</div>
<div class="grid" id="grid"></div>
<div id="toast"></div>
<div id="zoom"><img alt=""></div>

<script>
const STATUSES = ['brief','brief-approved','draft','approved','retired'];
const LABEL = {'brief':'idea','brief-approved':'idea approved','draft':'drawn - review','approved':'approved','retired':'retired'};
let rows = [], filter = 'open', docs = [];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||4500); }
async function api(url, body){
  const r = await fetch(url, body===undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok || j.error){ throw new Error(j.error || ('HTTP '+r.status)); }
  return j;
}
function getDoc(){ return $('#doc').value; }

async function loadDocs(){
  docs = await api('/api/images/docs');
  const sel = $('#doc'); let saved = null;
  try { saved = localStorage.getItem('imagesDoc'); } catch(e){}
  sel.innerHTML = docs.map(d => {
    const n = Object.values(d.images).reduce((a,b)=>a+b,0);
    return `<option value="${esc(d.doc)}">${esc(d.doc)}${n? '  ('+n+')':''}</option>`;
  }).join('');
  if(saved && docs.some(d=>d.doc===saved)) sel.value = saved;
}

function renderFilters(){
  const counts = {}; rows.forEach(r => counts[r.status]=(counts[r.status]||0)+1);
  const open = rows.filter(r=>r.status!=='retired').length;
  const items = [['open','all open',open]].concat(STATUSES.map(s=>[s, LABEL[s], counts[s]||0]));
  $('#filters').innerHTML = items.map(([k,l,n]) => `<span class="chip ${filter===k?'on':''}" data-f="${k}">${esc(l)} ${n}</span>`).join('');
  $('#summary').textContent = `${rows.length} row(s) - ${counts['approved']||0} approved`;
}

function actionsFor(r){
  const b = [];
  if(r.status==='brief') b.push(['approve-brief','Approve idea','primary']);
  if(r.status==='brief-approved') b.push(['generate','Generate image','primary']);
  if(r.status==='draft') b.push(['approve','Approve image','primary'], ['regenerate','Redraw (new version)','']);
  if(r.status==='approved') b.push(['regenerate','Redraw (new version)','']);
  if(r.status==='retired') b.push(['restore','Restore','']); else b.push(['retire','Retire','danger']);
  return b.map(([a,l,c]) => `<button class="${c}" data-act="${a}" data-id="${r.id}">${esc(l)}</button>`).join('');
}

function card(r){
  const img = r.has_image
    ? `<img loading="lazy" src="/api/images/thumb/${r.id}?v=${r.version}" data-full="/api/images/file/${r.id}" alt="${esc(r.title)}">`
    : `<span>${r.status==='brief'||r.status==='brief-approved' ? 'No image yet - approve the idea, then Generate' : 'No image file'}</span>`;
  return `<div class="card" id="c${r.id}">
    <div class="thumb">${img}</div>
    <div class="body">
      <div class="ttl">${esc(r.title||'(untitled)')}</div>
      <div class="meta"><span class="badge b-${r.status}">${esc(LABEL[r.status]||r.status)}</span>
        <span>#${r.id} v${r.version}</span><span>verse ${r.anchor_page}.${r.anchor_idx}</span><span>${esc(r.kind)}</span></div>
      ${r.caption_en? `<div class="cap">${esc(r.caption_en)}</div>`:''}
      ${r.caption_hi? `<div class="cap hi">${esc(r.caption_hi)}</div>`:''}
    </div>
    <div class="acts">${actionsFor(r)}</div>
    <details data-id="${r.id}"><summary>Edit idea, captions and placement</summary>
      <div class="ed">
        <label>Title</label><input data-k="title" value="${esc(r.title)}" style="width:100%">
        <label>What to draw (the idea)</label><textarea data-k="brief">${esc(r.brief)}</textarea>
        <label>Why it belongs here</label><textarea data-k="context_note">${esc(r.context_note)}</textarea>
        <label>Caption (English)</label><textarea data-k="caption_en">${esc(r.caption_en)}</textarea>
        <label>Caption (हिन्दी)</label><textarea data-k="caption_hi" class="cap hi">${esc(r.caption_hi)}</textarea>
        <label>Verse (page.idx)</label><input data-k="anchor" value="${r.anchor_page}.${r.anchor_idx}" style="width:7em">
        <button data-act="passage" data-id="${r.id}" style="margin-left:6px">Show verse</button>
        <div class="passage" id="p${r.id}" style="display:none"></div>
        <div style="margin-top:8px"><button class="primary" data-act="save" data-id="${r.id}">Save</button></div>
      </div>
    </details>
  </div>`;
}

function render(){
  renderFilters();
  const vis = rows.filter(r => filter==='open' ? r.status!=='retired' : r.status===filter);
  $('#grid').innerHTML = vis.length ? vis.map(card).join('')
    : `<div class="empty">Nothing here. ${rows.length? 'Change the filter above.' : 'Use "Propose ideas" to ask for a few illustration ideas for this text.'}</div>`;
}

async function load(){
  const d = getDoc(); if(!d) return;
  try { localStorage.setItem('imagesDoc', d); } catch(e){}
  try { rows = await api('/api/images/list?doc=' + encodeURIComponent(d)); render(); }
  catch(e){ toast('Could not load: ' + e.message); }
}

async function watch(jid, label){
  toast(label + ' started...', 2500);
  for(let i=0;i<600;i++){
    await new Promise(r=>setTimeout(r, 2000));
    let j; try { j = await api('/api/job/' + jid); } catch(e){ continue; }
    if(!j.running){
      const tail = (j.out||'').trim().split('\n').slice(-6).join('\n');
      toast((j.ok ? label + ' finished.\n' : label + ' FAILED.\n') + tail, 9000);
      load(); return;
    }
  }
}

document.addEventListener('click', async ev => {
  const chip = ev.target.closest('.chip');
  if(chip){ filter = chip.dataset.f; render(); return; }
  const im = ev.target.closest('.thumb img');
  if(im){ const z=$('#zoom'); z.querySelector('img').src = im.dataset.full; z.style.display='flex'; return; }
  if(ev.target.closest('#zoom')){ $('#zoom').style.display='none'; return; }
  const b = ev.target.closest('button[data-act]'); if(!b) return;
  const id = +b.dataset.id, act = b.dataset.act, r = rows.find(x=>x.id===id);
  try{
    if(act==='save'){
      const box = b.closest('.ed'); const body = {};
      box.querySelectorAll('[data-k]').forEach(el => body[el.dataset.k] = el.value);
      const res = await api(`/api/images/${id}/edit`, body);
      toast(res.note || 'Saved.'); load();
    } else if(act==='passage'){
      const anc = b.closest('.ed').querySelector('[data-k=anchor]').value.split('.');
      const p = await api(`/api/images/passage?doc=${encodeURIComponent(getDoc())}&page=${+anc[0]}&idx=${+(anc[1]||1)}`);
      const el = $('#p'+id); el.style.display='block';
      el.innerHTML = `<div class="sa">${esc(p.sa)}</div><div style="margin-top:4px">${esc(p.en||'(no English)')}</div><div class="sa" style="margin-top:4px">${esc(p.hi||'')}</div>`;
    } else if(act==='generate'){
      b.disabled = true; const j = await api('/api/images/generate', {doc:getDoc(), id}); watch(j.job, 'Image #' + id);
    } else if(act==='regenerate'){
      if(!confirm('Draw a new version of #' + id + '? The current one stays until you approve the new one.')) return;
      b.disabled = true; const j = await api(`/api/images/${id}/regenerate`, {}); watch(j.job, 'New version of #' + id);
    } else {
      if(act==='retire' && !confirm('Retire #' + id + '? The file is kept and it can be restored.')) return;
      await api(`/api/images/${id}/action`, {action: act}); load();
    }
  } catch(e){ toast(e.message); b.disabled = false; }
});

$('#doc').addEventListener('change', load);
$('#btnDedupe').addEventListener('click', async () => {
  try { const r = await api('/api/images/dedupe', {doc:getDoc()}); toast(r.retired.length ? 'Retired duplicates: #' + r.retired.join(', #') : 'No duplicates.'); load(); }
  catch(e){ toast(e.message); }
});
$('#btnBrief').addEventListener('click', async () => {
  const open = rows.filter(r=>r.status==='brief'||r.status==='brief-approved').length;
  let more = false;
  if(open){ if(!confirm(open + ' idea(s) are still unreviewed. Ask for more anyway?')) return; more = true; }
  try { const j = await api('/api/images/brief', {doc:getDoc(), max:+$('#maxn').value||6, more}); watch(j.job, 'Proposing ideas'); }
  catch(e){ toast(e.message); }
});
$('#btnGen').addEventListener('click', async () => {
  const n = rows.filter(r=>r.status==='brief-approved').length;
  if(!n){ toast('No approved ideas yet. Approve an idea first.'); return; }
  if(!confirm('Generate ' + n + ' image(s)? Each is drawn once (about $0.045 each with gemini-3.1-flash-image).')) return;
  try { const j = await api('/api/images/generate', {doc:getDoc()}); watch(j.job, 'Generating ' + n + ' image(s)'); }
  catch(e){ toast(e.message); }
});

loadDocs().then(load).catch(e => toast('Could not reach the dashboard API: ' + e.message, 9000));
</script>
</body>
</html>
