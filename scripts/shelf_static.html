<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shelf - Sanskrit Automaton</title>
<!-- SHELF_2026_10_04 - served by library_web.py at /shelf -->
<style>
:root{
  --bg:#0e0d0b; --bg2:#161411; --bg3:#1e1b16; --bg4:#28231b;
  --border:#35302680; --gold:#d4a017; --saffron:#f47c20; --cream:#f0e6cc;
  --muted:#8a7d67; --ink:#e8dcc8; --green:#4caf7d; --red:#e05f5f; --blue:#6b9bd2;
  --r:10px; --r-sm:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,'Segoe UI',sans-serif}
a{color:var(--gold)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:15px;margin:0;color:var(--cream)}
.sp{flex:1}
input,select,button{font:inherit;color:var(--ink);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r-sm);padding:5px 9px}
button{cursor:pointer} button:hover{border-color:var(--gold)}
button.primary{background:#3a2d10;border-color:var(--gold);color:var(--cream)}
.note{color:var(--muted);font-size:12.5px}
.col{padding:18px 16px 4px}
.col h2{margin:0 0 2px;font-size:18px;color:var(--cream);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.col h2 .sa{font-family:'Nirmala UI','Noto Serif Devanagari',serif;color:var(--muted);font-size:16px;font-weight:400}
.col h2 .n{font-size:12px;color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;padding:10px 0 8px}
.book{cursor:pointer;display:flex;flex-direction:column;gap:6px}
.cover{aspect-ratio:2/3;border-radius:4px 8px 8px 4px;overflow:hidden;position:relative;box-shadow:0 6px 14px #0008, inset 6px 0 0 #0003;border:1px solid #0006}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
/* CREDITS_COST_2026_10_04 (SHELF_UI2): bottom padding keeps the series line clear of the ed. badge */
.tcover{width:100%;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:14px 10px 30px;text-align:center;color:#f5ead0}
.bcode{font-size:10.5px;color:var(--muted);font-family:Consolas,monospace;word-break:break-all}
.tcover .t{font-family:Georgia,'Times New Roman',serif;font-size:14px;line-height:1.3;text-shadow:0 1px 2px #0008}
.tcover .s{font-family:'Nirmala UI','Noto Serif Devanagari',serif;font-size:15px;opacity:.9}
.tcover .rule{height:1px;background:#f5ead066;margin:6px 18px}
.tcover .c{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.badge{position:absolute;right:6px;bottom:6px;font-size:10.5px;background:#000a;color:var(--cream);padding:1px 6px;border-radius:99px}
.btitle{font-size:13px;color:var(--cream);line-height:1.3}
.bmeta{font-size:11.5px;color:var(--muted)}
.bar{height:4px;background:var(--bg4);border-radius:2px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .en{background:var(--blue)} .bar .hi{background:var(--saffron)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--bg2);border-left:1px solid var(--border);transform:translateX(100%);transition:transform .2s;z-index:10;overflow:auto;padding:16px}
#drawer.on{transform:none}
#drawer h3{margin:0 0 4px;color:var(--cream)}
#drawer label{display:block;font-size:11.5px;color:var(--muted);margin-top:10px}
#drawer input,#drawer select{width:100%}
#drawer .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
#drawer table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
#drawer td{padding:3px 4px;border-bottom:1px solid var(--border)}
#toast{position:fixed;left:16px;bottom:16px;background:var(--bg4);border:1px solid var(--gold);border-radius:var(--r);padding:8px 12px;display:none;z-index:20}
.empty{padding:40px;text-align:center;color:var(--muted)}
@media (max-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.col,.top{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="top">
  <a href="/" style="text-decoration:none">&larr; Dashboard</a>
  <h1>Shelf</h1>
  <input id="q" placeholder="Search titles and codes" style="min-width:200px">
  <select id="lang"><option value="">all</option><option value="en">with English</option><option value="hi">with Hindi</option><option value="none">not yet translated</option></select>
  <label class="note"><input type="checkbox" id="covers"> covers only</label>
  <span class="sp"></span>
  <span class="note" id="summary"></span>
  <button id="refresh" title="Rebuild from the database now">Refresh</button>
</div>
<div id="shelves"></div>
<div id="drawer"></div>
<div id="toast"></div>
<script>
let D = null;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none',4000); }
async function api(url, body){
  const r = await fetch(url, body===undefined ? {} : {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json().catch(()=>({error:'bad response'}));
  if(!r.ok || j.error) throw new Error(j.error || ('HTTP '+r.status));
  return j;
}
function hue(s){ let h=0; for(const c of s) h=(h*31 + c.charCodeAt(0))>>>0; return h % 360; }
function coverHtml(b, col){
  if(b.cover_id) return `<img loading="lazy" src="/api/images/thumb/${b.cover_id}" alt="${esc(b.title)}">`;
  const h = hue(col.key);
  return `<div class="tcover" style="background:linear-gradient(160deg,hsl(${h} 45% 24%),hsl(${(h+25)%360} 40% 13%))">
    <div class="c">${esc(col.title)}</div>
    <div><div class="s">${esc(b.title_sa||'')}</div>${b.title_sa?'<div class="rule"></div>':''}<div class="t">${esc(b.title)}</div></div>
    <div class="c">${b.series ? esc(b.series.title) + (b.series.number ? ' &middot; ' + b.series.number : '') : '&nbsp;'}</div></div>`;
}
function pct(a,b){ return b ? Math.round(100*a/b) : 0; }
function visible(b){
  const q = $('#q').value.trim().toLowerCase(), l = $('#lang').value;
  if(q && !(b.title.toLowerCase().includes(q) || b.code.toLowerCase().includes(q) || (b.title_sa||'').includes(q))) return false;
  if(l==='en' && !b.en) return false;
  if(l==='hi' && !b.hi) return false;
  if(l==='none' && (b.en || b.hi)) return false;
  if($('#covers').checked && !b.cover_id) return false;
  return true;
}
function render(){
  if(!D) return;
  let nb = 0, shown = 0;
  const html = D.collections.map(col => {
    const books = col.books.filter(visible); nb += col.books.length; shown += books.length;
    const dup = {}; col.books.forEach(x => { dup[x.title] = (dup[x.title] || 0) + 1; });   // SHELF_UI2
    if(!books.length) return '';
    return `<section class="col"><h2>${esc(col.title)} <span class="sa">${esc(col.title_sa||'')}</span><span class="n">${books.length} text(s)</span></h2>
      <div class="grid">${books.map(b => `<div class="book" data-code="${esc(b.code)}">
        <div class="cover">${coverHtml(b,col)}${b.editions.length||b.booksmith.length?`<span class="badge">${b.editions.length + b.booksmith.length} ed.</span>`:''}</div>
        <div class="btitle">${esc(b.title)}${b.title_confirmed?'':' <span class="note" title="derived from the code; confirm it in the details">*</span>'}</div>
        ${dup[b.title] > 1 ? `<div class="bcode" title="another text here has the same title">${esc(b.code)}</div>` : ''}
        <div class="bmeta">${b.passages} passages &middot; EN ${pct(b.en,b.passages)}% &middot; HI ${pct(b.hi,b.passages)}%</div>
        <div class="bar"><i class="en" style="width:${pct(b.en,b.passages)/2}%"></i><i class="hi" style="width:${pct(b.hi,b.passages)/2}%"></i></div>
      </div>`).join('')}</div></section>`;
  }).join('');
  $('#shelves').innerHTML = html || '<div class="empty">Nothing matches.</div>';
  $('#summary').textContent = `${shown} of ${nb} texts` + (D.from_file ? '' : ' - shelves are a draft from rules (python scripts\\collections_cfg.py --draft writes them to a file you can edit)');
}
function find(code){ for(const c of D.collections) for(const b of c.books) if(b.code===code) return [b,c]; return [null,null]; }
function openDrawer(code){
  const [b, col] = find(code); if(!b) return;
  const eds = b.editions.map(e => `<tr><td><a href="/api/shelf/file?name=${encodeURIComponent(e.name)}" target="_blank">${esc(e.name)}</a></td><td>${esc(e.format.toUpperCase())}</td><td>${Math.round(e.size/1024)} KB</td><td>${esc(e.mtime)}</td></tr>`).join('')
    + b.booksmith.map(x => `<tr><td><a href="/api/booksmith/pdf/${encodeURIComponent(b.code)}?mode=${x.mode}" target="_blank">Booksmith ${esc(x.mode)} ${esc(x.kind)}</a></td><td>PDF</td><td></td><td></td></tr>`).join('');
  $('#drawer').innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start;gap:8px">
      <div><h3>${esc(b.title)}</h3><div class="note">${esc(b.code)} &middot; ${esc(col.title)}${b.series?' &middot; '+esc(b.series.title)+(b.series.number?' '+b.series.number:''):''}</div></div>
      <button id="close">&times;</button></div>
    <div class="row"><a href="/reader/${encodeURIComponent(b.code)}" target="_blank"><button class="primary">Read</button></a>
      <button id="toImages">Images${b.images_approved?' ('+b.images_approved+' approved)':''}${b.cover_id?' &middot; cover':''}</button></div>
    <table><tr><td>Passages</td><td>${b.passages}</td></tr><tr><td>English</td><td>${b.en} (${pct(b.en,b.passages)}%)</td></tr>
      <tr><td>Hindi</td><td>${b.hi} (${pct(b.hi,b.passages)}%)</td></tr><tr><td>Category</td><td>${esc(b.category||'-')}</td></tr></table>
    <label>Display title ${b.title_confirmed?'(confirmed)':'(derived from the code - confirm or correct it)'}</label>
    <input id="t" value="${esc(b.title)}">
    <label>Devanagari title</label><input id="ts" value="${esc(b.title_sa||'')}" placeholder="नाम">
    <div class="row"><button id="saveT">Save titles</button></div>
    <label>Collection</label>
    <select id="mv">${D.keys.map(k => `<option value="${esc(k.key)}" ${k.key===col.key?'selected':''}>${esc(k.title)}</option>`).join('')}</select>
    <div class="row"><button id="saveC">Move</button></div>
    <label>Editions</label>
    ${eds ? `<table>${eds}</table>` : '<div class="note">No export yet. Export from the dashboard, or: python scripts\\export_html.py --db data\\context.db --doc ' + esc(b.code) + ' --sanskrit --hindi --side-by-side --images approved</div>'}`;
  $('#drawer').classList.add('on');
  $('#close').onclick = () => $('#drawer').classList.remove('on');
  $('#toImages').onclick = () => { try { localStorage.setItem('imagesDoc', b.code); } catch(e){} location.href = '/images'; };
  $('#saveT').onclick = async () => { try { await api('/api/shelf/title', {code:b.code, title:$('#t').value, title_sa:$('#ts').value}); toast('Titles saved to configs/doc_titles.json'); await load(true); openDrawer(code); } catch(e){ toast(e.message); } };
  $('#saveC').onclick = async () => { try { await api('/api/shelf/move', {code:b.code, key:$('#mv').value}); toast('Saved to configs/collections.json'); await load(true); openDrawer(code); } catch(e){ toast(e.message); } };
}
async function load(fresh){
  try { D = await api('/api/shelf' + (fresh ? '?fresh=1' : '')); render(); }
  catch(e){ $('#shelves').innerHTML = '<div class="empty">Could not load: ' + esc(e.message) + '</div>'; }
}
document.addEventListener('click', ev => { const b = ev.target.closest('.book'); if(b) openDrawer(b.dataset.code); });
['#q','#lang','#covers'].forEach(s => $(s).addEventListener('input', render));
$('#refresh').addEventListener('click', () => load(true));
load(false);
</script>
</body>
</html>
